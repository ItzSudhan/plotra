name: DCO

# Every commit in a pull request must carry a Signed-off-by line that matches
# its author (CONTRIBUTING.md, "Sign off your commits"). Plotra uses the
# Developer Certificate of Origin instead of a contributor licence agreement.

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error title=Missing sign-off::$(git show -s --format='%h %s' "$sha") has no 'Signed-off-by: $author' line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add the line with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off."
