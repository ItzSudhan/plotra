<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Plotra</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f3;
        --fg: #161412;
        --muted: #5f5a53;
        --line: #e2ded6;
        --card: #ffffff;
        --accent: #b5461a;
        --accent-fg: #ffffff;
        --ring: rgba(226, 96, 42, 0.55);
        --ring-soft: rgba(226, 96, 42, 0.16);
        --shadow: rgba(60, 40, 20, 0.35);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --fg: #ece9e3;
          --muted: #a8a299;
          --line: #2e2b27;
          --card: #1c1a18;
          --accent: #e2602a;
          --accent-fg: #ffffff;
          --ring: rgba(226, 96, 42, 0.6);
          --ring-soft: rgba(226, 96, 42, 0.2);
          --shadow: rgba(0, 0, 0, 0.7);
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
        font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 460px;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font: 400 34px/1.15 "Instrument Serif", "Iowan Old Style", Charter, Georgia, serif;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      a.button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      .waiting {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: -8px 0 24px;
        font-size: 13px;
        color: var(--muted);
      }
      .waiting[hidden] {
        display: none;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      @media (prefers-reduced-motion: no-preference) {
        .dot {
          animation: pulse 1.4s ease-in-out infinite;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      a.button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring);
      }
      /* Plotra, the way to the browser, and the browser. */
      .handoff {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 auto 26px;
      }
      .tile {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 13px;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: 0 8px 22px -14px var(--shadow);
      }
      .tile.plotra {
        font: 400 28px/1 "Instrument Serif", "Iowan Old Style", Charter, Georgia, serif;
        color: var(--accent);
      }
      .tile svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .path {
        position: relative;
        width: 74px;
        height: 2px;
        background-image: radial-gradient(circle, var(--line) 1px, transparent 1.5px);
        background-size: 7px 2px;
      }
      .path span {
        position: absolute;
        top: -3px;
        left: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--ring-soft);
      }
      body.failed .path span {
        display: none;
      }
      body.failed .tile.browser {
        opacity: 0.55;
      }
      @media (prefers-reduced-motion: no-preference) {
        main > * {
          animation: rise 560ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
          animation-delay: calc(var(--i, 0) * 80ms);
        }
        .tile.plotra {
          animation: pop 520ms cubic-bezier(0.3, 1.4, 0.5, 1) 120ms backwards;
        }
        .tile.browser {
          animation: pop 520ms cubic-bezier(0.3, 1.4, 0.5, 1) 260ms backwards;
        }
        .path span {
          animation: travel 2.4s cubic-bezier(0.6, 0, 0.4, 1) 500ms infinite;
        }
        body.failed .tile.browser {
          animation: nudge 500ms ease-in-out 400ms;
        }
        a.button {
          transition: transform 150ms cubic-bezier(0.2, 0.7, 0.2, 1), filter 150ms, border-color 150ms;
        }
        a.button:hover {
          transform: translateY(-1px);
        }
        a.button.primary:hover {
          filter: brightness(1.08);
        }
        a.button:active {
          transform: scale(0.97);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
      }
      @keyframes travel {
        0% {
          transform: translateX(0) scale(0.6);
          opacity: 0;
        }
        15% {
          opacity: 1;
          transform: translateX(6px) scale(1);
        }
        85% {
          opacity: 1;
          transform: translateX(60px) scale(1);
        }
        100% {
          transform: translateX(66px) scale(0.6);
          opacity: 0;
        }
      }
      @keyframes nudge {
        25% {
          transform: translateX(-3px);
        }
        75% {
          transform: translateX(3px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown in the window while the person signs in in their browser (src/sign-in.ts). The buttons link back to this page with an `action`; the app handles them (src/main.ts). -->
    <main>
      <div class="handoff" aria-hidden="true">
        <span class="tile plotra">P</span>
        <span class="path"><span></span></span>
        <span class="tile browser">
          <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5" /><path d="M3 9h18" /><path d="M6.5 6.8h.01M9 6.8h.01" /></svg>
        </span>
      </div>
      <h1 id="title" style="--i: 1">Sign in in your browser</h1>
      <p id="message" style="--i: 2">Plotra opened your browser to sign you in, with Google or your email. Once you have, Plotra comes back by itself.</p>
      <p class="waiting" id="waiting" style="--i: 3"><span class="dot" aria-hidden="true"></span>Waiting for you to sign in in the browser…</p>
      <div class="buttons" style="--i: 4">
        <a class="button primary" id="reopen" href="sign-in.html?action=reopen">Open the browser again</a>
        <a class="button" id="local" href="sign-in.html?action=local">Use a library on this computer</a>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      if (query.get("expired") === "1") {
        document.getElementById("title").textContent = "Sign in again";
        document.getElementById("message").textContent = "That sign-in had expired, so Plotra opened your browser again. Sign in there, and Plotra comes back by itself.";
      } else if (query.get("mode") === "sign-up") {
        document.getElementById("title").textContent = "Create your account in your browser";
        document.getElementById("message").textContent = "Plotra opened your browser to make your account, with Google or your email. Once you have, Plotra comes back by itself.";
        document.getElementById("waiting").lastChild.textContent = "Waiting for you in the browser…";
      } else if (query.get("failed") === "1") {
        document.getElementById("title").textContent = "Couldn't open your browser";
        document.getElementById("message").textContent = "Plotra signs you in through your browser. Try again, or use a library on this computer, which needs no account.";
        document.getElementById("reopen").textContent = "Try again";
        document.getElementById("waiting").hidden = true;
        document.body.classList.add("failed");
      }
      document.getElementById("reopen").focus();
    </script>
  </body>
</html>
