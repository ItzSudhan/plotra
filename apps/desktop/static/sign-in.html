<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Plotra</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f3;
        --fg: #161412;
        --muted: #5f5a53;
        --line: #e2ded6;
        --card: #ffffff;
        --accent: #b5461a;
        --accent-fg: #ffffff;
        --ring: rgba(226, 96, 42, 0.55);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --fg: #ece9e3;
          --muted: #a8a299;
          --line: #2e2b27;
          --card: #1c1a18;
          --accent: #e2602a;
          --accent-fg: #ffffff;
          --ring: rgba(226, 96, 42, 0.6);
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
        font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 460px;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font: 400 34px/1.15 "Instrument Serif", "Iowan Old Style", Charter, Georgia, serif;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      a.button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      a.button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring);
      }
    </style>
  </head>
  <body>
    <!-- Shown in the window while the person signs in in their browser (src/sign-in.ts). The buttons link back to this page with an `action`; the app handles them (src/main.ts). -->
    <main>
      <h1 id="title">Sign in in your browser</h1>
      <p id="message">Plotra opened your browser to sign you in. Once you have, come back here: Plotra opens by itself.</p>
      <div class="buttons">
        <a class="button primary" id="reopen" href="sign-in.html?action=reopen">Open the browser again</a>
        <a class="button" id="local" href="sign-in.html?action=local">Use a library on this computer</a>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      if (query.get("expired") === "1") {
        document.getElementById("title").textContent = "Sign in again";
        document.getElementById("message").textContent = "That sign-in had expired, so Plotra opened your browser again. Sign in there, then come back here.";
      } else if (query.get("failed") === "1") {
        document.getElementById("title").textContent = "Couldn't open your browser";
        document.getElementById("message").textContent = "Plotra signs you in through your browser. Try again, or use a library on this computer, which needs no account.";
        document.getElementById("reopen").textContent = "Try again";
      }
      document.getElementById("reopen").focus();
    </script>
  </body>
</html>
