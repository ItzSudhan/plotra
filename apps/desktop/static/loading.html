<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Plotra</title>
    <!--
      What a window shows from the moment it opens until its page is in (src/main.ts):
      Plotra Cloud loading, a library's page, or signing in after the browser hands over.
      `status` says which.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f3;
        --fg: #161412;
        --muted: #5f5a53;
        --line: #e2ded6;
        --accent: #e2602a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --fg: #ece9e3;
          --muted: #a8a299;
          --line: #2e2b27;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
        font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .mark {
        margin: 0;
        font: 400 44px/1 "Instrument Serif", "Iowan Old Style", Charter, Georgia, serif;
        letter-spacing: -0.01em;
      }
      #status {
        margin: 0;
        color: var(--muted);
        min-height: 1.5em;
      }
      #slow {
        margin: 6px 0 0;
        max-width: 360px;
        font-size: 13px;
        color: var(--muted);
        opacity: 0;
      }
      #slow.shown {
        opacity: 1;
      }
      .bar {
        margin-top: 8px;
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
      }
      @media (prefers-reduced-motion: no-preference) {
        body > * {
          animation: rise 360ms ease-out both;
        }
        .bar span {
          animation: slide 1.4s ease-in-out infinite;
        }
        #slow {
          transition: opacity 300ms;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body role="status" aria-live="polite">
    <p class="mark" aria-hidden="true">Plotra</p>
    <p id="status">Loading…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p id="slow">This is taking longer than usual. Check your internet connection; Plotra keeps trying.</p>
    <script>
      const query = new URLSearchParams(location.search);
      const status = query.get("status");
      if (status) {
        document.getElementById("status").textContent = status;
        document.title = status.replace(/…$/, "");
      }
      // Only Plotra Cloud waits on the internet: a library's page is on this computer.
      if (query.get("online") === "1") setTimeout(() => document.getElementById("slow").classList.add("shown"), 8000);
    </script>
  </body>
</html>
