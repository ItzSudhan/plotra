<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Opening your library</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f3;
        --fg: #161412;
        --muted: #5f5a53;
        --line: #e2ded6;
        --accent: #e2602a;
        --paper: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --fg: #ece9e3;
          --muted: #a8a299;
          --line: #2e2b27;
          --paper: #1c1a18;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 20px 32px;
        box-sizing: border-box;
        text-align: center;
        font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
        cursor: default;
      }
      h1 {
        margin: 0;
        font: 400 28px/1.15 "Instrument Serif", "Iowan Old Style", Charter, Georgia, serif;
      }
      #name {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status {
        margin: 0;
        color: var(--muted);
      }
      /* A small book whose pages turn while the library opens. */
      .book {
        position: relative;
        width: 56px;
        height: 34px;
        margin: 0 0 10px;
        perspective: 220px;
      }
      .book::before,
      .book::after,
      .page {
        content: "";
        position: absolute;
        top: 0;
        width: 28px;
        height: 34px;
        box-sizing: border-box;
        border: 1.5px solid var(--accent);
        background: var(--paper);
      }
      .book::before {
        left: 0;
        border-radius: 5px 2px 2px 5px;
      }
      .book::after {
        right: 0;
        border-radius: 2px 5px 5px 2px;
      }
      .page {
        right: 0;
        z-index: 1;
        border-radius: 2px 5px 5px 2px;
        transform-origin: left center;
        /* Lines of writing on the page. */
        background-image: linear-gradient(var(--line) 1.5px, transparent 1.5px);
        background-size: 16px 6px;
        background-position: 5px 7px;
        background-repeat: repeat-y;
        background-color: var(--paper);
      }
      .page:nth-child(2) {
        opacity: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        body > * {
          animation: rise 460ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
          animation-delay: calc(var(--i, 0) * 70ms + 60ms);
        }
        .page {
          animation: turn 1.8s cubic-bezier(0.55, 0, 0.35, 1) infinite;
        }
        .page:nth-child(2) {
          animation-delay: 0.9s;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes turn {
        0% {
          transform: rotateY(0);
          opacity: 1;
        }
        70% {
          transform: rotateY(-180deg);
          opacity: 1;
        }
        71%,
        100% {
          transform: rotateY(-180deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body role="status" aria-live="polite">
    <div class="book" aria-hidden="true"><span class="page"></span><span class="page"></span></div>
    <h1 style="--i: 1">Opening your library…</h1>
    <p id="name" style="--i: 2"></p>
    <p id="status" style="--i: 3" hidden></p>
    <script>
      const params = new URLSearchParams(location.search);
      const name = params.get("name");
      const status = params.get("status");
      if (name) {
        document.getElementById("name").textContent = name;
        document.title = `Opening ${name}`;
      }
      if (status) {
        const line = document.getElementById("status");
        line.textContent = status;
        line.hidden = false;
      }
    </script>
  </body>
</html>
