# Packaging Plotra's desktop app (local-mode-plan.md, phases 4 and 7).
# `bun run dist` compiles the main process, builds the app's local server
# (scripts/bundle-server.ts) and packages both for the platform it runs on.
appId: ink.plotra.desktop
productName: Plotra
copyright: Copyright © 2026 Plotra
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**
  - static/**
  - package.json
# The local server and its migrations stay outside the app archive: Node has
# to read them as plain files, PGlite its WebAssembly too.
extraResources:
  - from: build/server
    to: server
  - from: build/migrations
    to: migrations
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build-resources/icon.png
  # Fixed names (no version), so plotra.ink/download can link to the latest release's files.
  artifactName: Plotra-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # Signing needs an Apple Developer ID (CSC_LINK / CSC_KEY_PASSWORD) and
  # notarizing needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID.
  # Without them the build is unsigned, and macOS warns on first open.
  notarize: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build-resources/icon.png
  artifactName: Plotra-windows-${arch}-setup.${ext}
  # Signing: WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (a code-signing certificate).
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  artifactName: Plotra-linux-${arch}.${ext}
  category: Office
  icon: build-resources/icon.png
  maintainer: Plotra
# Automatic updates come from this repository's GitHub releases (src/updates.ts).
publish:
  provider: github
  owner: ItzSudhan
  repo: plotra
  releaseType: release
